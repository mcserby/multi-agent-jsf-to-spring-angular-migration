[project]
name = "jsf-migrator"
version = "0.1.0"
description = "Multi-agent audit + fixer framework for JSF -> Spring Boot + Angular migrations, driven by gemini-cli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mihai.serban" }]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jsf-migrate = "jsf_migrator.cli:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsf_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
